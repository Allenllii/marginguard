name: Offline verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: offline-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NEBIUS_ENABLE_LIVE: 'false'
      TAVILY_ENABLE_LIVE: 'false'
      PROVIDER_HARD_CAPS_VERIFIED: 'false'
    steps:
      - name: Check out exact event source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up the tested Node runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Install the exact public lockfile without lifecycle scripts
        run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - name: Lint, strict types, builds, unit/API and synthetic regression cases
        run: npm run check
      - name: Verify the forced-offline artifact and cold-isolate behavior
        run: npm run build:offline-demo
