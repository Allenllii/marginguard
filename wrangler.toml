# Cloudflare Workers deployment for the public live demo.
# Provider keys are Worker secrets (`wrangler secret put`), never in this file.
name = "marginguard"
main = "worker/index.js"
compatibility_date = "2026-10-01"
account_id = "4b6f1c341d88e036f5c6c45418b115ff"
workers_dev = true
preview_urls = false

[vars]
TAVILY_ENABLE_LIVE = "true"
NEBIUS_ENABLE_LIVE = "true"
NEBIUS_MODEL = "nvidia/Nemotron-3_5-Lightning"
NEBIUS_REASONING_MODEL = "nvidia/nemotron-3-super-120b-a12b"
# Per provider: 4 calls/minute, 40/day, 300 in total, enforced in D1 before each call.
LIVE_MINUTE_LIMIT = "4"
LIVE_DAILY_LIMIT = "40"
LIVE_TOTAL_LIMIT = "300"
# Covers the judging period (ends 2026-12-23).
LIVE_ENABLED_UNTIL = "2026-12-24T00:00:00Z"
# Set after the account owner confirmed Tavily and Nebius spending caps (2026-10-30).
PROVIDER_HARD_CAPS_VERIFIED = "true"

[[d1_databases]]
binding = "DB"
database_name = "marginguard"
database_id = "c065fb98-c839-4a45-b995-8bf569c0925f"
migrations_dir = "drizzle"
